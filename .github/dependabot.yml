version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'docker'
    directory: '/examples/proxy-validation-test'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

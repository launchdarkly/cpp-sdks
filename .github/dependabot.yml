version: 2
updates:
  - package-ecosystem: 'docker'
    directory: '/examples/proxy-validation-test'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/client-sdk'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/common'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/internal'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/networking'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/server-sdk'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'

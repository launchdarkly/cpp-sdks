  - package-ecosystem: 'npm'
    directory: '/libs/server-sdk-dynamodb-source'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/server-sdk-otel'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/server-sdk-redis-source'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'

  - package-ecosystem: 'npm'
    directory: '/libs/server-sent-events'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly*'
        - '@launchdarkly/*'
